name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS, Core Audio)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
      - name: Known-answer checks
        run: swift run -c release feral-cli check
      - name: The example show's taps, an impulse through it, and what it holds
        run: |
          swift run -c release feral-cli taps --config examples/stage-test.json
          swift run -c release feral-cli impulse --config examples/stage-test.json --source 1
          swift run -c release feral-cli show info --config examples/stage-test.json
      - name: The engine with the example show, driven by feral-cli, crashed and replayed
        run: ./scripts/ci-engine-smoke.sh
      - name: Bundle the app
        run: ./scripts/build-app.sh
      - name: Bundle the engine
        run: ./scripts/build-engine-app.sh
      - name: Check the launchd agent file
        run: |
          sed -e "s|@ENGINE@|/tmp/feral-engine|" -e "s|@LOGS@|/tmp|" launchd/local.feral.engine.plist > /tmp/agent.plist
          plutil -lint /tmp/agent.plist
      - name: Run the engine's commands
        run: |
          build/FeralEngine.app/Contents/MacOS/feral-engine --version
          build/FeralEngine.app/Contents/MacOS/feral-engine devices

  linux:
    name: Build and test (Linux, render core only)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
      - name: Known-answer checks
        run: swift run -c release feral-cli check
      - name: The example show offline
        run: swift run -c release feral-cli show info --config examples/stage-test.json
      - name: Test the render-state swap under the thread sanitizer
        run: swift test --sanitize=thread --filter RenderCoreTests
